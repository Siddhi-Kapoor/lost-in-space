<section id="intro" class="ov"><div class="ctr"><p class="mono ln">NASA SPACE APPS CHALLENGE</p><h1 class="orb ln" style="animation-delay:.6s">LOST-IN-SPACE</h1>

/* ---------- ARTIFACT DATA (facts from NASA mission pages; every record links its source) ---------- */
const A=[
{i:'lm',n:'Apollo Lunar Modules',m:'Apollo 11–17',t:'Lander',d:'Moon',y:1969,l:'Jul 16, 1969 (Apollo 11 launch)',s:'Mission completed',lt:'Confirmed surface location',lo:'Descent stages sit at six landing sites. Ascent stages met different fates, so each mission must be checked separately.',u:'https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=1969-059C',
c:['Landing two people on the Moon and bringing them home needed a ship built just for lunar gravity and vacuum.','The Lunar Module rode to the Moon attached to the Apollo ship, then undocked and dropped from lunar orbit to the surface.','Its descent stage braked the fall and became a launch pad. The ascent stage lifted the crew back up to orbit.','Six crewed landings between 1969 and 1972 let astronauts collect samples and set up experiments.','Every descent stage stayed on the Moon. Ascent stages differed: some were crashed on purpose, and Apollo 11’s was left in orbit.'],v:'I was never meant to fly home whole. Half of me stayed behind so you could leave.'},
{i:'lrv',n:'Lunar Roving Vehicles',m:'Apollo 15, 16, 17',t:'Rover',d:'Moon',y:1971,l:'Jul 26, 1971 (Apollo 15 launch)',s:'Mission completed',lt:'Confirmed surface location',lo:'Hadley–Apennine, Descartes and Taurus–Littrow landing sites',u:'https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=1971-063C',
c:['Early crews stayed close to their lander. Scientists wanted astronauts to reach rocks much farther away.','Folded up inside the Lunar Module, each “Moon buggy” was unpacked and unfolded by the astronauts on the surface.','Each wheel had its own electric motor, powered by batteries. Two astronauts and their tools rode on board.','The rovers carried crews to distant rocks and back, and the samples they gathered were studied on Earth.','One was left at each of the three sites after the last drive. They have been parked there ever since.'],v:'Four wheels, four motors, and two explorers who trusted me with their way home.'},
{i:'alsep',n:'ALSEP Science Stations',m:'Apollo 12, 14, 15, 16, 17',t:'Instruments',d:'Moon',y:1969,l:'Nov 14, 1969 (Apollo 12 launch)',s:'Mission completed',lt:'Confirmed surface location',lo:'Near five Apollo landing sites. Apollo 11 left a smaller package.',u:'https://nssdc.gsfc.nasa.gov/nmc/spacecraft/display.action?id=1969-099C',
c:['Scientists wanted instruments that would keep working long after the astronauts went home.','Crews unpacked each station near their lander, set up the instruments and linked them to Earth by radio.','Seismometers listened for moonquakes. Other instruments measured magnetic fields, heat flow and charged particles. The laser reflectors are a separate experiment, not part of ALSEP.','Moonquake data showed the Moon has a crust, mantle and core, and that it can ring for a long time after a quake.','On September 30, 1977, NASA switched the stations off by command.'],v:'I listened to the Moon for years. It rang like a bell.'},
{i:'surveyor',n:'Surveyor Landers',m:'Surveyor 1–7',t:'Lander',d:'Moon',y:1966,l:'May 30, 1966 (Surveyor 1)',s:'Mission completed',lt:'Confirmed surface location',lo:'Five soft-landing sites, for example Surveyor 3 in Oceanus Procellarum',u:'https://science.nasa.gov/mission/surveyor-3/',
c:['Before sending people, NASA had to learn whether lunar dust could hold up a spacecraft.','Seven Surveyors flew in 1966–1968. Five made soft landings: Surveyors 1, 3, 5, 6 and 7.','They sent back many thousands of photos, tested how strong the soil was, and some analysed its chemistry.','The soil was firm enough to land on. That cleared an important hurdle for Apollo.','They stayed where they landed. In 1969 the Apollo 12 crew visited Surveyor 3 and brought some of its parts home.'],v:'I went first so that no one after me had to guess.'},
{i:'sojourner',n:'Sojourner & Mars Pathfinder',m:'Mars Pathfinder',t:'Rover',d:'Mars',y:1996,l:'Dec 4, 1996',s:'Communication lost',lt:'Confirmed surface location',lo:'Ares Vallis, Mars (landed July 4, 1997)',u:'https://science.nasa.gov/mission/mars-pathfinder/',
c:['After Viking, NASA wanted a cheaper, faster way to reach Mars, and a way to test a small roving robot.','Pathfinder landed inside giant airbags that bounced across Ares Vallis on July 4, 1997.','Sojourner, the first rover on Mars, rolled out to study rocks and soil with a chemical analyser.','It proved a rover could work on Mars, and the mission returned many thousands of images.','Contact with Pathfinder ended in September 1997, far beyond its planned lifetime.'],v:'I was about the size of a microwave oven, and I rolled onto a whole new world.'},
{i:'spirit',n:'Spirit Rover',m:'Mars Exploration Rovers',t:'Rover',d:'Mars',y:2003,l:'Jun 10, 2003',s:'Communication lost',lt:'Confirmed surface location',lo:'Gusev Crater, Mars (landed January 2004)',u:'https://science.nasa.gov/mission/mars-exploration-rovers-spirit-and-opportunity/',
c:['NASA sent two twin rovers to look for signs that Mars once had liquid water. Spirit went first.','Launched in June 2003, Spirit landed in Gusev Crater in January 2004.','It carried cameras, spectrometers and a tool to grind into rocks and test their chemistry.','It found silica-rich soil, a clue that hot water was once there.','In 2009 Spirit got stuck in soft sand. Its last contact was March 22, 2010.'],v:'I outlived my plan by years, got stuck, and kept doing science anyway.'},
{i:'opportunity',n:'Opportunity Rover',m:'Mars Exploration Rovers',t:'Rover',d:'Mars',y:2003,l:'Jul 7, 2003',s:'Communication lost',lt:'Confirmed surface location',lo:'Meridiani Planum, Mars (landed January 2004)',u:'https://science.nasa.gov/mission/mars-exploration-rovers-spirit-and-opportunity/',
c:['Spirit’s twin was sent to the other side of Mars to test a very different place for signs of ancient water.','It landed in Meridiani Planum in January 2004, inside a small crater.','It found tiny round hematite pebbles nicknamed “blueberries” and layered rock shaped by water.','Its findings helped show that wet conditions once existed on Mars.','A huge dust storm in 2018 blocked its sunlight. NASA declared the mission complete in February 2019.'],v:'Almost fifteen years on Mars. The dust finally won, but I had seen a watery past.'},
{i:'viking',n:'Viking 1 & 2 Landers',m:'Viking',t:'Lander',d:'Mars',y:1975,l:'Aug 20, 1975 (Viking 1); Sep 9, 1975 (Viking 2)',s:'Mission completed',lt:'Confirmed surface location',lo:'Viking 1: Chryse Planitia (July 1976). Viking 2: Utopia Planitia (September 1976).',u:'https://science.nasa.gov/mission/viking-1/',
c:['Viking asked a huge question: is there life on Mars? NASA built two orbiter-and-lander pairs to look.','Each pair entered Mars orbit in mid-1976, then released its lander to the surface.','The landers photographed the ground, measured weather and ran three biology experiments on soil.','The biology results were puzzling and are not accepted as proof of life. The orbiters mapped most of Mars.','Viking 2’s lander ended in April 1980. Viking 1’s last contact came in November 1982.'],v:'I scooped Martian soil and asked it one question: is anything alive?'},
{i:'phoenix',n:'Phoenix Lander',m:'Phoenix Mars Lander',t:'Lander',d:'Mars',y:2007,l:'Aug 4, 2007',s:'Communication lost',lt:'Confirmed surface location',lo:'Green Valley, Vastitas Borealis, northern Mars (landed May 2008)',u:'https://science.nasa.gov/mission/phoenix/',
c:['Scientists believed water ice lay just under Mars’s arctic plains. Phoenix was sent to dig for it.','It landed near the north pole region on rocket thrusters on May 25, 2008.','A robotic arm scooped soil and ice into small ovens and chemistry labs on the lander.','It confirmed water ice below the surface and found salts called perchlorates in the soil.','As Martian winter brought darkness, its solar panels could not make enough power. It last called in November 2008.'],v:'I dug into the cold and found ice. Then the sun went away.'},
{i:'insight',n:'InSight Lander',m:'InSight',t:'Lander',d:'Mars',y:2018,l:'May 5, 2018',s:'Mission completed',lt:'Confirmed surface location',lo:'Elysium Planitia, Mars (landed November 2018)',u:'https://science.nasa.gov/mission/insight/',
c:['How did Mars form? InSight was sent to listen to its inside rather than look at its surface.','It landed on the smooth plains of Elysium Planitia in November 2018.','Its seismometer sat on the ground and felt “marsquakes”, like a stethoscope listening to a heartbeat.','It recorded more than 1,300 marsquakes, which revealed Mars’s crust, mantle and core.','Dust built up on its solar panels until it ran out of power. NASA ended the mission in December 2022.'],v:'I never moved. I just listened, and Mars told me what it is made of.'},
{i:'dawn',n:'Dawn Spacecraft',m:'Dawn',t:'Orbiter',d:'Asteroids',y:2007,l:'Sep 27, 2007',s:'Orbiting (out of fuel)',lt:'Orbital location',lo:'In orbit around dwarf planet Ceres in the asteroid belt. Not a surface object.',u:'https://science.nasa.gov/mission/dawn/',
c:['Vesta and Ceres are leftovers from the birth of the solar system. Dawn was sent to compare the two.','Launched in 2007, Dawn used ion engines to reach Vesta in 2011 and Ceres in 2015.','An ion engine pushes out charged xenon gas, a gentle push that adds up over years. Dawn also carried cameras and mapping tools.','It mapped Vesta, then became the first spacecraft to orbit a dwarf planet, finding bright salt deposits on Ceres.','It ran out of the fuel it used to aim itself in 2018. It still circles Ceres and will for decades.'],v:'I changed worlds using only a whisper of thrust.'},
{i:'near',n:'NEAR Shoemaker',m:'NEAR Shoemaker',t:'Orbiter',d:'Asteroids',y:1996,l:'Feb 17, 1996',s:'Mission completed',lt:'Approximate surface location',lo:'On asteroid 433 Eros, a near-Earth asteroid (landed February 2001). Shown with the belt for convenience.',u:'https://science.nasa.gov/mission/near-shoemaker/',
c:['Asteroids are time capsules from the early solar system. NASA wanted a close-up look at one.','Launched in 1996, NEAR entered orbit around 433 Eros in February 2000, the first orbit of an asteroid.','It mapped Eros’s shape, craters and boulders, and measured its makeup and gravity.','Eros turned out to be a solid, potato-shaped rock covered in dust and boulders.','NEAR was not built to land, but in February 2001 it touched down gently and kept signalling for about two weeks.'],v:'I was not built to land. I did it anyway, and kept talking.'},
{i:'pioneer',n:'Pioneer 10 & 11',m:'Pioneer',t:'Deep-space probe',d:'Deep Space',y:1972,l:'Mar 3, 1972 (Pioneer 10); Apr 5, 1973 (Pioneer 11)',s:'Still travelling (silent)',lt:'Deep-space trajectory',lo:'Heading out of the solar system. No fixed position.',u:'https://science.nasa.gov/mission/pioneer-10/',
c:['Nobody knew whether a spacecraft could cross the asteroid belt and survive Jupiter’s radiation.','Pioneer 10 flew past Jupiter in 1973. Pioneer 11 followed in 1974, then reached Saturn in 1979.','They measured magnetic fields, radiation and particles, and sent the first close-up pictures of Jupiter.','Each carries a plaque showing where and who we are, a message for anyone who finds it.','Pioneer 11’s last signal came in 1995 and Pioneer 10’s in 2003. Both still coast outward.'],v:'I carry a message to anyone out there. I cannot tell if anyone is listening.'},
{i:'ingenuity',n:'Ingenuity Mars Helicopter',m:'Mars 2020 (Perseverance)',t:'Aircraft',d:'Mars',y:2020,l:'Jul 30, 2020',s:'Mission completed',lt:'Confirmed surface location',lo:'Jezero Crater, Mars',u:'https://science.nasa.gov/mission/mars-2020-perseverance/ingenuity-mars-helicopter/',
c:['Could an aircraft fly on another planet? Mars’s thin air makes it very hard.','Ingenuity rode to Jezero Crater tucked under the Perseverance rover and was set down in 2021.','Its blades spin much faster than a helicopter’s on Earth so they can grip the thin air.','On April 19, 2021 it made the first powered flight on another planet, then flew 72 times in total.','On flight 72, in January 2024, its rotor blades were damaged. NASA ended the mission and it rests in Jezero Crater.'],v:'A test flight that kept going. Seventy-two flights where only a few were promised.'},
{i:'kepler',n:'Kepler Space Telescope',m:'Kepler',t:'Space telescope',d:'Deep Space',y:2009,l:'Mar 6, 2009',s:'Orbiting (out of fuel)',lt:'Orbital location',lo:'Earth-trailing orbit around the Sun. Not a surface object.',u:'https://science.nasa.gov/mission/kepler/',
c:['Are there planets around other stars? Kepler was built to find them and count them.','Launched in 2009, it trailed Earth around the Sun and stared at one patch of sky.','It watched for tiny dips in a star’s light when a planet passes in front. This is called the transit method.','It found thousands of exoplanets and showed that planets are common in our galaxy.','Out of fuel, it was retired on October 30, 2018. It still circles the Sun.'],v:'I stared at one patch of sky for years and found whole new solar systems.'}];

 cv.addEventListener('pointerdown',e=>{dn=true;mv=0;px=e.clientX;py=e.clientY});
 addEventListener('pointerup',e=>{if(dn&&mv<5&&mode=='x'&&e.target==cv){const k=pick(e);if(k)sel(k)}dn=false});
 cv.addEventListener('pointermove',e=>{if(dn){const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;mv+=Math.abs(dx)+Math.abs(dy);if(mode=='x'){cam.th-=dx*.006;cam.ph=Math.max(.15,Math.min(2.99,cam.ph-dy*.006))}}else if(mode=='x'){hov=pick(e);cv.style.cursor=hov?'pointer':'grab'}});
 cv.addEventListener('wheel',e=>{if(mode=='x'){e.preventDefault();cam.tr=Math.max(2.5,Math.min(320,cam.tr*(1+e.deltaY*.001)))}},{passive:false});
}else{ready();}
requestAnimationFrame(loop);
</script></body></html>
